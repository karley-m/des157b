<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Progress</title>

    <!-- Normalize CSS for browser compatability -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Add link to any google fonts used here -->
    <link rel="stylesheet" href="https://use.typekit.net/yvx8kgc.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&display=swap" rel="stylesheet">

    <style>

        body {
            background-color:antiquewhite;
            text-align: center;
            margin:auto;
        }
        

        h1 {
            font-family: 'rl-horizon';
            text-align:center;
        }

        h2 {
            font-family: "Darker Grotesque";
        }

        img {
            display:block;
            text-align:center;
            margin:auto;
        }

        @media (min-width: 768px) {
            section {
                display: grid;
                grid-template-columns: repeat(2, 1fr); 
                grid-auto-flow: row; 
                gap: 10px;
                margin:auto;
                text-align:center;
            }

            article {
                text-align:center;
                margin:auto;
            }
        }

    </style>
</head>
<body>
    <h1>Design Progress Development</h1>
    <section>
        
        <article>
            <h2>Moodboard</h2>
            <img src="images/moodboard.png" alt="moodboard" width="550">
        </article>
        
       

        <article>
            <h2>House Shape Concepts</h2>
            <img src="images/concept.jpg" alt="concept art of homes" width="470">
        </article>
        
        
        
    </section>
    
    
    
</body>
</html>
