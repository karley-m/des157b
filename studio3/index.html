<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Liberty</title>
    
    <!-- normalize css -->

    <!-- google fonts -->

    <!-- link to my css -->
    <link href="styles.css" rel="stylesheet">

   <!------ scripts are at bottom of html -------->
    

</head>
<body>

    <div id="inputScreen" class="screen">
        <h2>Save Text to Back4App</h2>

        <input type="text" id="textInput" placeholder="Type something..." />
    

        <select id="categorySelect" required>
            <option value="">Select a category</option>
            <option value="person">A person</option>
            <option value="place">A place</option>
            <option value="thing">A thing</option>
            <option value="object">An object</option>
            <option value="pet">A pet</option>
            <option value="idea">An idea</option>
            <option value="smell">A smell</option>
            <option value="taste">A taste</option>
            <option value="sound">A sound</option>
        </select>

        <button onclick="saveText()">Save</button>
    </div>

    <div id="resultsScreen" class="screen hidden">
        <div id="gallery"></div>
    </div>
        

    

    <!-- parallax script -->
    <script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>

    <!-- parse script for back4app -->
    <script src="https://unpkg.com/parse/dist/parse.min.js"></script>

    <!-- my script -->
    <script src="script.js"></script>
</body>
</html>
